name: Ephemeral Spark Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/services/spark_analytics.py'
      - 'scripts/external_spark_validation.py'
      - 'scripts/benchmark.py'
      - 'tests/test_external_spark_validation.py'
      - 'tests/test_spark_mapping_contract.py'
      - 'tests/test_ephemeral_spark_workflow.py'
      - '.github/workflows/ephemeral-spark-validation.yml'

concurrency:
  group: ephemeral-spark-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Start ephemeral Spark cluster
        run: |
          set -euxo pipefail
          docker pull apache/spark:3.5.8-python3
          docker network create hr-spark-ci
          docker run -d --name spark-master --network hr-spark-ci -p 7077:7077 -p 8080:8080 \
            apache/spark:3.5.8-python3 \
            /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master \
            --host 0.0.0.0 --port 7077 --webui-port 8080
          docker run -d --name spark-worker --network hr-spark-ci \
            --add-host host.docker.internal:host-gateway \
            apache/spark:3.5.8-python3 \
            /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker \
            spark://spark-master:7077 --cores 2 --memory 2g
          docker ps --format 'table {{.Names}}\t{{.Status}}'

      - name: Install validation dependencies
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -e '.[dev,bigdata]'

      - name: Wait for Spark master and worker
        run: |
          for attempt in $(seq 1 30); do
            if python - <<'PY'
          import socket
          with socket.create_connection(('127.0.0.1', 7077), timeout=2):
              print('Spark master reachable')
          PY
            then
              break
            fi
            sleep 2
          done
          python - <<'PY'
          import socket
          with socket.create_connection(('127.0.0.1', 7077), timeout=5):
              print('Spark master TCP endpoint reachable from the runner')
          PY
          for attempt in $(seq 1 30); do
            if docker logs spark-worker 2>&1 | grep -q 'Successfully registered with master'; then
              echo 'Spark worker registered with master'
              break
            fi
            sleep 2
          done
          if ! docker logs spark-worker 2>&1 | grep -q 'Successfully registered with master'; then
            echo 'Spark worker did not register in time.'
            docker logs spark-master
            docker logs spark-worker
            exit 1
          fi

      - name: Configure routable Spark driver endpoint
        run: |
          set -euo pipefail
          RUNNER_IP=$(hostname -I | awk '{print $1}')
          test -n "$RUNNER_IP"
          case "$RUNNER_IP" in
            127.*|0.0.0.0|::1) echo "No routable runner address: $RUNNER_IP"; exit 1 ;;
          esac
          echo "HR_ANALYTICS_SPARK_MASTER=spark://${RUNNER_IP}:7077" >> "$GITHUB_ENV"
          echo "HR_ANALYTICS_SPARK_DRIVER_HOST=host.docker.internal" >> "$GITHUB_ENV"
          echo "HR_ANALYTICS_SPARK_DRIVER_BIND_ADDRESS=0.0.0.0" >> "$GITHUB_ENV"
          echo "Using runner address $RUNNER_IP for Spark master endpoint"

      - name: Run external Spark protocol against ephemeral cluster
        run: |
          . .venv/bin/activate
          mkdir -p artifacts
          python scripts/external_spark_validation.py \
            --sizes 100 1000 10000 \
            --seed 42 \
            --output artifacts/external-spark.json

      - name: Validate evidence artifact
        run: |
          . .venv/bin/activate
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('artifacts/external-spark.json').read_text())
          assert data['protocol'] == 'external_spark_scalability_v2'
          assert data['seed'] == 42
          assert data['sizes'] == [100, 1000, 10000]
          assert [run['rows'] for run in data['runs']] == data['sizes']
          for run in data['runs']:
              validation = run['validation']
              assert validation['row_count_matches_fixture'] is True
              assert validation['distributed'] is True
              assert validation['raw_rows_returned'] is False
              assert validation['aggregates_match_local_baseline'] is True
              assert run['elapsed_seconds'] >= 0
              assert run['rows_per_second'] > 0
          print('Ephemeral external Spark evidence artifact verified.')
          PY

      - name: Upload validation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ephemeral-spark-validation-${{ github.sha }}
          path: artifacts/external-spark.json
          retention-days: 30

      - name: Dump Spark logs on failure
        if: failure()
        run: |
          docker ps -a --format 'table {{.Names}}\t{{.Status}}'
          docker logs spark-master || true
          docker logs spark-worker || true

      - name: Stop ephemeral Spark cluster
        if: always()
        run: |
          docker rm -f spark-worker spark-master || true
          docker network rm hr-spark-ci || true
