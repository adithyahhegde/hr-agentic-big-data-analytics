name: External Spark Validation

on:
  workflow_dispatch:
    inputs:
      spark_version:
        description: 'Spark/PySpark version installed on the target cluster'
        required: true
        default: '3.5.8'
        type: string

concurrency:
  group: external-spark-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HR_ANALYTICS_SPARK_MASTER: ${{ secrets.HR_ANALYTICS_SPARK_MASTER }}
      HR_ANALYTICS_SPARK_DRIVER_HOST: ${{ secrets.HR_ANALYTICS_SPARK_DRIVER_HOST }}
      HR_ANALYTICS_SPARK_DRIVER_BIND_ADDRESS: ${{ secrets.HR_ANALYTICS_SPARK_DRIVER_BIND_ADDRESS }}
      SPARK_VALIDATION_VERSION: ${{ inputs.spark_version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Require a non-local target cluster
        run: |
          test -n "$HR_ANALYTICS_SPARK_MASTER" || { echo 'HR_ANALYTICS_SPARK_MASTER is required for this manual validation gate.'; exit 1; }
          test -n "$SPARK_VALIDATION_VERSION" || { echo 'spark_version workflow input is required.'; exit 1; }
          case "$HR_ANALYTICS_SPARK_MASTER" in
            spark://localhost:*|spark://127.0.0.1:*|spark://\[::1\]:*) echo 'Local/loopback Spark masters are not accepted.'; exit 1;;
          esac
      - name: Preflight target connectivity
        run: |
          python - <<'PY'
          import os
          import socket
          from urllib.parse import urlsplit

          master = os.environ["HR_ANALYTICS_SPARK_MASTER"].strip()
          parsed = urlsplit(master)
          if parsed.scheme != "spark" or not parsed.hostname or parsed.port is None:
              raise SystemExit("HR_ANALYTICS_SPARK_MASTER must be spark://host:port")
          try:
              with socket.create_connection((parsed.hostname, parsed.port), timeout=5):
                  print(f"Target Spark master TCP endpoint reachable: {parsed.hostname}:{parsed.port}")
          except OSError as error:
              raise SystemExit(
                  f"Target Spark master is not reachable from this runner at {parsed.hostname}:{parsed.port}: {error}"
              )
          driver_host = os.environ.get("HR_ANALYTICS_SPARK_DRIVER_HOST", "").strip()
          driver_bind = os.environ.get("HR_ANALYTICS_SPARK_DRIVER_BIND_ADDRESS", "").strip()
          if driver_host:
              print(f"Configured Spark driver host: {driver_host}")
          if driver_bind:
              print(f"Configured Spark driver bind address: {driver_bind}")
          print(f"Expected Spark/PySpark version: {os.environ['SPARK_VALIDATION_VERSION']}")
          PY
      - name: Install validation dependencies
        run: python -m pip install --upgrade pip && pip install -e '.[dev,bigdata]' "pyspark==${SPARK_VALIDATION_VERSION}"
      - name: Verify PySpark driver version
        run: |
          python - <<'PY'
          import os
          import pyspark

          expected = os.environ["SPARK_VALIDATION_VERSION"]
          if pyspark.__version__ != expected:
              raise SystemExit(
                  f"PySpark driver/cluster version contract failed: driver={pyspark.__version__}, expected={expected}"
              )
          print(f"PySpark driver version matches target contract: {expected}")
          PY
      - name: Run external Spark protocol
        run: python scripts/external_spark_validation.py --sizes 100 1000 10000 --seed 42 --output artifacts/external-spark.json
      - name: Validate evidence artifact
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          p = Path('artifacts/external-spark.json')
          data = json.loads(p.read_text())
          expected_version = os.environ['SPARK_VALIDATION_VERSION']
          assert data['protocol'] == 'external_spark_scalability_v2'
          assert data['seed'] == 42
          assert data['sizes'] == [100, 1000, 10000]
          assert [m['rows'] for m in data['runs']] == data['sizes']
          assert data['source_revision'] == os.environ['GITHUB_SHA']
          assert data['source_revision'] != 'unknown'
          assert isinstance(data['runtime']['python_version'], str) and data['runtime']['python_version']
          assert isinstance(data['runtime']['platform'], str) and data['runtime']['platform']
          assert data['master_kind'] == 'spark'
          configured_master = os.environ['HR_ANALYTICS_SPARK_MASTER'].strip()
          assert configured_master
          for measurement in data['runs']:
              assert len(measurement['fixture_sha256']) == 64
              assert measurement['fixture_schema']
              validation = measurement['validation']
              execution = measurement['result']['execution']
              assert validation['row_count_matches_fixture'] is True
              assert validation['distributed'] is True
              assert validation['raw_rows_returned'] is False
              assert validation['aggregates_match_local_baseline'] is True
              assert validation['spark_version_present'] is True
              assert validation['parallelism_positive'] is True
              assert validation['application_id_present'] is True
              assert execution['spark_version'] == expected_version
              assert execution['default_parallelism'] > 0
              assert execution['application_id']
              assert execution['input_mode'] == 'driver_parallelized_csv'
              assert measurement['elapsed_seconds'] > 0
              assert measurement['rows_per_second'] > 0
          print('External Spark evidence artifact verified.')
          PY
      - name: Validate reusable evidence provenance
        run: python scripts/validate_external_spark_evidence.py artifacts/external-spark.json
      - name: Summarize verified evidence
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          data = json.loads(Path("artifacts/external-spark.json").read_text(encoding="utf-8"))
          print("## External Spark validation")
          print("")
          print(f"- Protocol: `{data['protocol']}`")
          print(f"- Source revision: `{data['source_revision']}`")
          print(f"- Spark master kind: `{data['master_kind']}`")
          print(f"- Spark/PySpark version: `{data['runs'][0]['result']['execution']['spark_version']}`")
          print(f"- Fixture sizes: `{data['sizes']}`")
          print("")
          print("| Rows | Seconds | Rows/s | Parallelism | Application |")
          print("| ---: | ---: | ---: | ---: | --- |")
          for measurement in data["runs"]:
              execution = measurement["result"]["execution"]
              print(
                  f"| {measurement['rows']:,} | {measurement['elapsed_seconds']:.6f} "
                  f"| {measurement['rows_per_second']:,.3f} | {execution['default_parallelism']} "
                  f"| `{execution['application_id']}` |"
              )
          print("")
          print("Evidence is aggregate-only and includes fixture, source-revision, runtime, Spark-version, parallelism, and application provenance.")
          PY
      - name: Upload validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: external-spark-validation
          path: artifacts/external-spark.json
