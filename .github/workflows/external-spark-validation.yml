name: External Spark Validation

on:
  workflow_dispatch:

concurrency:
  group: external-spark-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HR_ANALYTICS_SPARK_MASTER: ${{ secrets.HR_ANALYTICS_SPARK_MASTER }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Require a non-local target cluster
        run: |
          test -n "$HR_ANALYTICS_SPARK_MASTER" || { echo 'HR_ANALYTICS_SPARK_MASTER is required for this manual validation gate.'; exit 1; }
          case "$HR_ANALYTICS_SPARK_MASTER" in
            spark://localhost:*|spark://127.0.0.1:*|spark://\[::1\]:*) echo 'Local/loopback Spark masters are not accepted.'; exit 1;;
          esac
      - name: Preflight target connectivity
        run: |
          python - <<'PY'
          import os
          import socket
          from urllib.parse import urlsplit

          master = os.environ["HR_ANALYTICS_SPARK_MASTER"].strip()
          parsed = urlsplit(master)
          if parsed.scheme != "spark" or not parsed.hostname or parsed.port is None:
              raise SystemExit("HR_ANALYTICS_SPARK_MASTER must be spark://host:port")
          try:
              with socket.create_connection((parsed.hostname, parsed.port), timeout=5):
                  print(f"Target Spark master TCP endpoint reachable: {parsed.hostname}:{parsed.port}")
          except OSError as error:
              raise SystemExit(
                  f"Target Spark master is not reachable from this runner at {parsed.hostname}:{parsed.port}: {error}"
              )
          PY
      - name: Install validation dependencies
        run: python -m pip install --upgrade pip && pip install -e '.[dev,bigdata]'
      - name: Run external Spark protocol
        run: python scripts/external_spark_validation.py --sizes 100 1000 10000 --seed 42 --output artifacts/external-spark.json
      - name: Validate evidence artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('artifacts/external-spark.json')
          data = json.loads(p.read_text())
          assert data['protocol'] == 'external_spark_scalability_v2'
          assert data['seed'] == 42
          assert data['sizes'] == [100, 1000, 10000]
          assert [m['rows'] for m in data['runs']] == data['sizes']
          for measurement in data['runs']:
              validation = measurement['validation']
              execution = measurement['result']['execution']
              assert validation['row_count_matches_fixture'] is True
              assert validation['distributed'] is True
              assert validation['raw_rows_returned'] is False
              assert validation['aggregates_match_local_baseline'] is True
              assert validation['spark_version_present'] is True
              assert validation['parallelism_positive'] is True
              assert validation['application_id_present'] is True
              assert execution['spark_version']
              assert execution['default_parallelism'] > 0
              assert execution['application_id']
              assert execution['input_mode'] == 'driver_parallelized_csv'
              assert measurement['elapsed_seconds'] >= 0
              assert measurement['rows_per_second'] > 0
          print('External Spark evidence artifact verified.')
          PY
      - name: Upload validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: external-spark-validation
          path: artifacts/external-spark.json
