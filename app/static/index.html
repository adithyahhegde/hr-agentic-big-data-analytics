<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HR Analytics</title><link rel="stylesheet" href="/static/styles.css"></head>
<body><main><header><p class="eyebrow">HR analytics</p><h1>Dataset intake</h1><p>Upload a UTF-8 CSV to validate its structure, profile the data, and review deterministic HR-field candidates.</p></header>
<section aria-labelledby="upload-heading"><h2 id="upload-heading">Upload data</h2><form id="upload-form"><label for="dataset">CSV file</label><input id="dataset" name="file" type="file" accept=".csv,text/csv" required><button type="submit">Validate and profile</button></form><p id="status" role="status"></p></section>
<section id="result" hidden aria-live="polite"><h2>Profile</h2><div id="summary"></div><table><thead><tr><th>Source field</th><th>Type</th><th>Missing</th><th>Candidate</th><th>Decision</th></tr></thead><tbody id="rows"></tbody></table><h2>Warnings</h2><ul id="issues"></ul></section></main><script src="/static/app.js"></script></body></html>
